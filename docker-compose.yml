# Local PostgreSQL for development and tests.
# One server, two databases: salary_dev (app) and salary_test (automated tests).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: salary
      POSTGRES_PASSWORD: salary
      POSTGRES_DB: salary_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salary -d salary_dev']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
